♥<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가봤던 캠핑장</title>

  <!-- Leaflet CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
  html, body {
    height: 100%;
    margin: 0;
    background: #f7f7f7;
    font-family: "Pretendard", sans-serif;
  }

  h1 {
    text-align: center;
    padding: 12px 0;
    margin: 0;
  }

  #map {
    height: calc(100vh - 60px); /* 상단 제목 높이만큼 제외 */
    width: 100%;
  }

       /* 원 상단 라벨 스타일 */
    .circle-label {
      background: transparent;  /* 배경 투명 */
      padding: 3px 8px;
      border-radius: 0;
      font-size: 13px;
      font-weight: bold;
      color: red;               /* 글씨 빨간색 */
      border: none;
      text-align: center;
    } 
</style>
</head>
<body>
  <h1>주요 캠핑장 위치</h1>
  <div id="map"></div>

  <script>
    const places = [
{ name: "the360", "lat": 35.78378750, "lng": 128.21582813 },
{ name: "고래불", "lat": 36.57076250, "lng": 129.42007813 },
{ name: "나정고운모래해변", "lat": 35.78331250, "lng": 129.49132812 },
{ name: "빙계얼음골야영장", "lat": 36.23453750, "lng": 128.76954688 },
{ name: "가야산오토캠핑장", "lat": 35.85636250, "lng": 128.10360937 },
{ name: "거창국민여가", "lat": 35.76133750, "lng": 127.72429688 },
{ name: "구미캠핑장", "lat": 36.13343750, "lng": 128.37107813 },
{ name: "대가야캠프", "lat": 35.71263750, "lng": 128.26570313 },
{ name: "삼강나루", "lat": 36.56426250, "lng": 128.30132813 },
{ name: "보현산별빛테마마을 야영장", "lat": 36.14041250, "lng": 128.99595312 },
{ name: "무창포오토", "lat": 36.24116250, "lng": 126.53576562 },
{ name: "에코그린", "lat": 33.44431250, "lng": 126.33395312 },
{ name: "붉은오름", "lat": 33.40181250, "lng": 126.67539063 },
{ name: "진주 도토리캠핑장", "lat": 35.27626250, "lng": 128.03904687 },
{ name: "양지생태마을캠핑", "lat": 35.69513750, "lng": 127.86051563 },
{ name: "몽산포오토캠핑장", "lat": 36.66963750, "lng": 126.28720313 },
{ name: "왕산골캠핑농원", "lat": 36.19098750, "lng": 128.32148438 },
{ name: "태백 눈꽃 야영장", "lat": 37.13193750, "lng": 128.96173437 },
{ name: "송하루관광농원", "lat": 36.27843750, "lng": 128.26810937 },
{ name: "파크킹", "lat": 36.17961250, "lng": 128.12532813 },
{ name: "소리길 오토 캠핑장", "lat": 35.77526250, "lng": 128.12720313 },
{ name: "함양라온캠핑장", "lat": 35.62536250, "lng": 127.77385938 },
{ name: "숲에안기다", "lat": 35.77191250, "lng": 128.17785937 },
{ name: "돌고래송어장", "lat": 36.47118750, "lng": 127.96426563 },
{ name: "누리별캠핑장", addr: "경상북도 김천시 부항면 하대리 193번지 1층", lat: 35.99236250, lng: 127.93339063, isOption: false },
{ name: "펀펀오토캠핑장", addr: "경상북도 상주시 화서면 문장로 425-5", lat: 36.47118750, lng: 127.96426563, isOption: false },
{ name: "달서별빛캠프 캠핑장", addr: "대구광역시 달서구 송현동 산56", lat: 35.82391250, lng: 128.55710938, isOption: false },
{ name: "문복산캠핑장", addr: "경상북도 경주시 산내면 대현리 산384", lat: 35.66073750, lng: 129.05242188, isOption: false },
{ name: "위천수변테마파크", addr: "군위군 효령면 간동유원지길 8 대구광역시", lat: 36.17628750, lng: 128.58557813, isOption: false },
{ name: "한티별빛아래오토캠핑장", addr: "경상북도 칠곡군 가산면 응추리 121-2", lat: 36.03698750, lng: 128.61610937, isOption: false },
{ name: "용추그린하우스", addr: "경상남도 함양군 안의면 신안리 480-5", lat: 35.64573750, lng: 127.80589062, isOption: false },
  { name: "꿈꾸는캠핑", "lat": 35.6256, "lng": 128.0423 },
  { name: "썬빌리지", "lat": 36.0620, "lng": 129.5741 },
  { name: "수달", "lat": 36.2448, "lng": 128.9643 },
  { name: "상주보 휴", "lat": 36.4554, "lng": 128.2519 },
  { name: "별고을", "lat": 35.9277, "lng": 128.1051 },
  { name: "정이품송", "lat": 36.4721, "lng": 127.7920 },
  { name: "그린스톤", "lat": 36.6832, "lng": 127.9774 },
  { name: "병술만", "lat": 36.4690, "lng": 126.3408 },
  { name: "우산캠핑", "lat": 36.4727, "lng": 128.0659 },
  { name: "수피아", "lat": 36.0869, "lng": 128.4847 },
  { name: "행화촌", "lat": 36.0008, "lng": 128.4839 },
  { name: "대가야캠프", "lat": 35.7959, "lng": 128.3160 },
  { name: "히든벨리", "lat": 36.6492, "lng": 127.9908 },
  { name: "전원일기", "lat": 35.6854, "lng": 129.0501 },
  { name: "청춘별곡", "lat": 35.2097, "lng": 128.1530 },
  { name: "거제궁농", "lat": 35.0086, "lng": 128.7039 },      
  { name: "바람이좋은저녁", "lat": 36.1052, "lng": 128.7809 },
  { name: "상주보", "lat": 36.4480, "lng": 128.2585 }
    ];

    // 지도 생성(구미 시청)
    const map = L.map('map').setView([36.1239, 128.3440], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 마커 추가 및 이름 표시
    places.forEach(p => {
      L.marker([p.lat, p.lng])
        .addTo(map)
        .bindPopup(`<b>${p.name}</b>`)
        .bindTooltip(p.name, { permanent: true, direction: "top", offset: [0, -10] });
    });
        // 중심 좌표
    const center = [36.1239, 128.3440];

    // 공통 원 옵션
    const circleOptions = { color: 'orange', weight: 2, dashArray: '6 6', fill: false };
    const radii = [50000, 100000, 150000, 200000]; // 50/100/150 km
    const circles = [];

    // 지구 반지름
    const R = 6371e3;
    const rad2deg = 180 / Math.PI;

    // 각도 기반 이동 함수 (distance: m, angle: deg)
    function moveAtAngle(lat, lng, distanceMeters, angleDeg) {
      const angleRad = angleDeg * Math.PI / 180;
      const deltaLat = (distanceMeters * Math.cos(angleRad)) / R;
      const deltaLng = (distanceMeters * Math.sin(angleRad)) / (R * Math.cos(lat * Math.PI / 180));
      return [lat + deltaLat * rad2deg, lng + deltaLng * rad2deg];
    }

    // 원과 라벨 생성 (2시 방향 = 30°)
    radii.forEach(r => {
      // 원 생성
      const circle = L.circle(center, { ...circleOptions, radius: r })
        .addTo(map)
        .bindPopup(`반경 ${r/1000} km`);
      circles.push(circle);

      // 라벨 생성 (2시 방향)
      const labelPos = moveAtAngle(center[0], center[1], r, 30);
      L.marker(labelPos, {
        icon: L.divIcon({
          className: 'circle-label',
          html: `<b>${r/1000} km</b>`,
          iconSize: [60, 20],
          iconAnchor: [30, 10]
        })
      }).addTo(map);
    });

    // 원 그룹화해서 토글 가능
    const radiiLayer = L.layerGroup(circles).addTo(map);
    L.control.layers(null, { '반경 50/100/150/200km': radiiLayer }, { collapsed: false }).addTo(map);

    // (선택) 150km 원이 화면에 모두 보이도록 지도 맞춤
    // map.fitBounds(circles[2].getBounds());
  </script>
</body>
</html>
